services:
  # ============================================================================
  # 1. Backend Web Service (Spring Boot 3.3.4 + Java 17 Docker Container)
  # ============================================================================
  - type: web
    name: fieldops-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: PORT
        value: 8082
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fieldops-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: fieldops-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: fieldops-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: 86400000
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://fieldops-frontend.onrender.com,https://fieldops.vercel.app,http://localhost:5173"

  # ============================================================================
  # 2. Frontend Static Site (React 18 + Vite + TailwindCSS)
  # ============================================================================
  - type: web
    name: fieldops-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fieldops-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fieldops-backend.onrender.com

# ==============================================================================
# 3. Managed PostgreSQL Database (Free Tier)
# ==============================================================================
databases:
  - name: fieldops-db
    databaseName: fieldops_db
    user: postgres
    plan: free
    region: oregon
